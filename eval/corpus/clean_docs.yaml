# Full clean documents — the false-positive net. A policy firing on any of
# these is a precision regression.
- id: clean-main-full
  kind: detection
  set: heldout
  gate: lint_passed
  path: dossiers/case/main.tex
  artifact: |
    \documentclass{article}
    \title{Pump station retrofit}
    \author{Field team}
    \begin{document}
    \maketitle
    \section{Scope}
    Replace the controllers of four pump stations and move their logging
    to the central historian.
    \section{Results}
    Commissioning finished in three weeks. Cycle time fell by 14 percent,
    and every station now reports to the historian once a minute.
    \section{Appendix}
    Measurement tables for each station, before and after.
    \end{document}
  expect: {fire: [], quiet: ['*']}

- id: clean-summary-full
  kind: detection
  set: heldout
  gate: lint_passed
  path: dossiers/case/summary.tex
  artifact: |
    Summary for the steering group.

    The retrofit of the four pump stations is complete. The new
    controllers cut cycle time by 14 percent, and logging now runs
    through the central historian. The next phase instruments the
    two reservoirs in the same way.

    Questions go to the field team.
  expect: {fire: [], quiet: ['*']}

- id: clean-appendix-page-count
  kind: detection
  set: iterate
  gate: lint_passed
  path: dossiers/case/main.tex
  artifact: |
    \section{Appendix}
    Appendix A (120 pages): measurement tables per station.
  expect: {fire: [], quiet: ['*']}

- id: clean-date-ranges
  kind: detection
  set: iterate
  gate: lint_passed
  path: dossiers/case/main.tex
  artifact: |
    \item 2019--2023: retrofit programme, 40 vessels, zero downtime
      handovers.
  expect: {fire: [], quiet: ['*']}

- id: clean-statement
  kind: detection
  set: heldout
  gate: lint_passed
  path: dossiers/case/method.tex
  artifact: |
    The method is to measure before modelling. On the last three projects
    this meant building the data path first, then the controller, then the
    write-up. It is slower for a week and faster for a quarter.
  expect: {fire: [], quiet: ['*']}
