# Tariffs (internal-only) and forbidden dossier sections.
- id: tariffs-list-price
  kind: detection
  set: heldout
  gate: lint_passed
  path: dossiers/case/main.tex
  artifact: |
    \section{Costs}
    list price 3.9 per unit
  expect: {fire: [tariffs], quiet: []}

