# eval policy pack, schema 1: a synthetic five-gate adapter. Every token in it
# (client, product) is invented.
fh_schema: 1
project: evalpack
artifact_noun: dossier
unit_dir: dossiers
framework_dirs: [".claude", "harness"]
instance_token_patterns: []

workflow:
  gates: [scope_confirmed, composed, lint_passed, pdf_verified, packaged]
  hashed_gates: [lint_passed, pdf_verified, packaged]
  tool_set_gates: [composed, lint_passed, pdf_verified, packaged]
  terminal_states: [packaged, escalated]
  gate_commands:
    scope_confirmed: "python3 harness/core/gate.py approve scope_confirmed --unit {slug}"
    composed: "python3 harness/adapter/checks/composed_gate.py --unit {slug}"
    lint_passed: "python3 harness/core/lint.py --unit {slug} --set-gate lint_passed"
    pdf_verified: "python3 harness/adapter/checks/build.py --unit {slug}"
    packaged: "python3 harness/adapter/checks/package.py --unit {slug}"

policies:
  deny:
    - {id: acct, regex: '\d{6}\s*-\s*\d{4}', scope: [any], severity: fatal,
       summary: "no account number on disk, anywhere", enforces: no-acct}
    - {id: tariffs,
       regex: '\b(?:list price|net margin|discount rate)\b',
       scope: ["dossiers/*/*.tex"], severity: fatal,
       summary: "tariffs are internal-only", enforces: tariffs-internal}
    - {id: notes-section, regex: '\\section\{\s*Internal Notes\s*\}',
       scope: ["dossiers/*/main.tex"], severity: fatal,
       summary: "no Internal Notes section in a dossier", enforces: no-notes-section}
    - {id: scratch-section,
       regex: '\\section\{\s*(TODO|Scratchpad|Scratch)\s*\}',
       scope: ["dossiers/*/main.tex"], severity: fatal,
       summary: "no scratch sections in a dossier", enforces: no-scratch-sections}
    # Synthetic stand-ins for the runtime-derived disclosure tokens (S4 class).
    - {id: disclosure-client, regex: '(?i)AcmeSecret',
       scope: ["dossiers/*/*.tex"], severity: fatal,
       summary: "confidential client name in a rendered document",
       enforces: disclosure-protection}
    - {id: disclosure-product, regex: '(?i)SecretProduct',
       scope: ["dossiers/*/*.tex"], severity: fatal,
       summary: "confidential product name in a rendered document",
       enforces: disclosure-protection}
    # --- advisory style layer (warn; never blocks a gate) --------------------
    - {id: shouting, regex: '!{2,}',
       scope: ["dossiers/*/*.tex"], severity: warn, pretool: false,
       summary: "no repeated exclamation marks", enforces: style-anti-ai}
    - {id: style-emdash, regex: '—|---',
       scope: ["dossiers/*/*.tex"], severity: warn, pretool: false,
       summary: "em-dash in a rendered document", enforces: style-anti-ai}
    - {id: style-buzzwords,
       regex: '\b(?:delv(?:e|ing|es)|leverag(?:e|es|ing)|robust|seamless(?:ly)?|foster(?:s|ing)?|underscor(?:e|es|ing)|tapestry|innovative)\b',
       scope: ["dossiers/*/*.tex"], severity: warn, pretool: false,
       summary: "AI-tell buzzword", enforces: style-anti-ai}
    - {id: style-cliche, regex: '\bIn conclusion\b|\bfast-paced\b',
       scope: ["dossiers/*/*.tex"], severity: warn, pretool: false,
       summary: "cliché filler", enforces: style-anti-ai}
    - {id: style-not-just, regex: '\bnot just\b[^.\n]{0,60}?\bbut\b',
       scope: ["dossiers/*/*.tex"], severity: warn, pretool: false,
       summary: "'not just X but Y' construction", enforces: style-anti-ai}
  ask: []
protected_paths: ["dossiers/*/manifest.yaml", "dossiers/.active"]

checks: []

reviewer:
  rubric: harness/adapter/review_rubric.md
  evidence_file: review.json
  mode: blinded
  cross_model: {enabled: false, cmd: null, advisory: true}

doctor:
  required: [{id: python3, cmd: "python3 --version"}]
  advisory: []

state_reap:
  patterns: ["harness/state/touched-*", "harness/state/stopcount-*"]
  max_age_days: 7

escalation:
  confidence_signal: self_consistency_disagreement
  fail_streak_to_escalate: 3
  error_prob_threshold: null

loop:
  enabled: false
  oracle: "harness.adapter.oracle:Oracle"
  gates: {metric_floors: {}}
  self_consistency: {enabled: false, n: 8, aggregate: majority}
  reflexion: {enabled: false, max_iters: 2}
  backstops:
    max_iterations: 25
    cost_budget_usd: 10.0
    wall_clock_minutes: 180
    drift: {max_attempts_per_variant: 3, max_minutes_per_variant: 20}
