# Nightly lane: the deterministic corpus (make eval), on a schedule so it cannot silently rot.
# The chaos and fuzz lanes were dropped in X1 (D4); crash recovery is covered by the
# kill-and-proceed tests in core/tests/graph and core/tests/search.
name: nightly
"on":
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - run: make eval
