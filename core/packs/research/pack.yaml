# packs/research/pack.yaml: the claim-and-source pack (plan section 1.13).
# The checks are ported from seed/checks/verify_claims.py (verify_claims.py)
# and the source hygiene check (sources.py). Check ids are the plan's.
pack: research
version: 1
readers:
  - {match: ["**/*.pdf"], reader: pdf_text}
  - {match: ["**/*.md", "**/*.txt"], reader: text}
tools: [read_file, glob, grep, write_file, edit_file, fetch_url, web_search]
checks:
  - {id: claims-have-sources, cmd: "python3 {pack}/checks/verify_claims.py {files} --unit {unit} --mode sources", on: ["**/*.md"]}
  - {id: claims-verified, cmd: "python3 {pack}/checks/verify_claims.py {files} --unit {unit} --mode values"}
  - {id: sources-resolve, cmd: "python3 {pack}/checks/sources.py {unit}", on: ["sources/**"]}
gate_presets:
  default: [scoped, sourced, composed, verified]
doctor:
  advisory: [{id: pdftotext, cmd: "pdftotext -v"}]
