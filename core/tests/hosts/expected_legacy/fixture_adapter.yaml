fh_schema: 1
project: fixtureproj
artifact_noun: note
unit_dir: units
framework_dirs:
- .claude
- harness
instance_token_patterns: []
workflow:
  gates:
  - composed
  - checked
  - verified
  hashed_gates:
  - verified
  tool_set_gates:
  - verified
  gate_commands:
    composed: python3 harness/core/gate.py approve composed --unit {slug}
    checked: python3 harness/core/gate.py approve checked --unit {slug}
    verified: python3 harness/core/lint.py --unit {slug} --set-gate verified
policies:
  deny:
  - id: acct
    regex: \d{6}\s*-?\s*\d{4}
    scope:
    - any
    summary: no account number on disk
    enforces: no-acct
  - id: todo-advisory
    regex: ADVISORY-MARKER
    scope:
    - units/**
    summary: advisory marker
    severity: warn
    pretool: false
  ask:
  - paths:
    - templates/**
    reason: read-only by convention
protected_paths:
- units/*/manifest.yaml
- units/.active
checks: []
reviewer:
  rubric: harness/adapter/review_rubric.md
  evidence_file: review.json
  mode: blinded
  cross_model:
    enabled: false
    cmd: null
    advisory: true
doctor:
  required:
  - id: python3
    cmd: python3 --version
  advisory:
  - id: missing-tool
    cmd: definitely-not-a-real-binary-fh --version
state_reap:
  patterns:
  - harness/state/touched-*
  - harness/state/stopcount-*
  max_age_days: 7
escalation:
  confidence_signal: self_consistency_disagreement
  fail_streak_to_escalate: 3
  error_prob_threshold: null
loop:
  enabled: false
  oracle: harness.adapter.oracle:Oracle
  gates:
    metric_floors: {}
  self_consistency:
    enabled: false
    n: 8
    aggregate: majority
  reflexion:
    enabled: false
    max_iters: 2
  backstops:
    max_iterations: 25
    cost_budget_usd: 10.0
    wall_clock_minutes: 180
    drift:
      max_attempts_per_variant: 3
      max_minutes_per_variant: 20
