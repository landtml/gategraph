# adapter.yaml: the single source of truth for this project's enforcement (schema 2).
# The schema is core/kernel/schema/adapter.v2.schema.yaml in the GateGraph template.
# A gate passes only when its checks pass under `gate attempt`, or when its approval is
# answered through `gate proceed`. Nothing else sets a gate.
schema: 2
project: {{FH_PROJECT}}
unit_noun: {{FH_ARTIFACT_NOUN}}   # what one unit of work is
unit_dir: {{FH_UNIT_DIR}}
packs: {{FH_PACKS}}               # domain packs, stamped to packs/<name>/

checks:
  # The policy scan over one unit. `make check` runs the same script over every unit.
  - {id: policy, command: "python3 harness/adapter/checks/policy_scan.py --unit {unit}", severity: fatal}

gates:
{{FH_GATES_BLOCK}}

policy:
{{FH_POLICY_BLOCK}}
  protected_paths: ["{{FH_UNIT_DIR}}/*/manifest.yaml"]
